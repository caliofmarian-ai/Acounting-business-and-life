name: Microbusiness Readiness PostgreSQL #873

on:
  pull_request:
    paths:
      - 'microbusiness-readiness-core.js'
      - 'tests/microbusiness-readiness-schema-singleflight-873.test.js'
      - 'scripts/microbusiness-readiness-runtime-873.mjs'
      - '.github/workflows/microbusiness-readiness-postgres-873.yml'
  push:
    branches: [main]
    paths:
      - 'microbusiness-readiness-core.js'
      - 'tests/microbusiness-readiness-schema-singleflight-873.test.js'
      - 'scripts/microbusiness-readiness-runtime-873.mjs'
      - '.github/workflows/microbusiness-readiness-postgres-873.yml'

permissions:
  contents: read

jobs:
  isolated-postgres-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abl_admin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abl_admin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: abl_admin_ci
      TOKEN_SECRET: ci-readiness-873-not-for-production
      APP_PIN: '0000'
      NODE_ENV: test
      PORT: '3000'
      PAYMONGO_MODE: sandbox
      PAYMONGO_LIVE_ENABLED: 'false'
      RAILWAY_SERVICE_NAME: accounting-admin-runtime-ci
      ABL_READINESS_CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Start application with isolated PostgreSQL
        run: |
          npm start > /tmp/abl-readiness-873.log 2>&1 &
          echo $! > /tmp/abl-readiness-873.pid
      - name: Wait for health
        run: |
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/abl-readiness-873.log
          exit 1
      - name: Verify real PostgreSQL concurrency and authenticated Merchant HTTP
        run: node scripts/microbusiness-readiness-runtime-873.mjs
      - name: Application log on failure
        if: failure()
        run: tail -100 /tmp/abl-readiness-873.log || true
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/abl-readiness-873.pid ]; then
            kill "$(cat /tmp/abl-readiness-873.pid)" 2>/dev/null || true
          fi
