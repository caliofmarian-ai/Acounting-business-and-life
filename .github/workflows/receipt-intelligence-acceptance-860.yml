name: Receipt Intelligence authenticated acceptance 860

on:
  pull_request:
    paths:
      - qa-acceptance.js
      - qa-receipt-intelligence-860.js
      - tests/qa-receipt-intelligence-860.test.js
      - receipt-intelligence-core.js
      - receipt-intelligence-provider.js
      - receipt-intelligence-routes.js
      - receipt-receiving-preflight.js
      - public/receipt-intelligence-ui.js
      - tests/receipt-intelligence-v1.test.js
      - tests/receipt-receiving-preflight-v1.test.js
      - tests/receipt-intelligence-variance-postgres-860.test.js
      - .github/workflows/receipt-intelligence-acceptance-860.yml

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: receipt860
          POSTGRES_PASSWORD: ci_receipt860_only
          POSTGRES_DB: abl_receipt_variance_860_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U receipt860 -d abl_receipt_variance_860_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify literal PR head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Exercise receipt intelligence and blind-count regressions
        env:
          RECEIPT_860_PG_URL: postgresql://receipt860:ci_receipt860_only@127.0.0.1:5432/abl_receipt_variance_860_test
        run: |
          node --check qa-acceptance.js
          node --check qa-receipt-intelligence-860.js
          node --check tests/qa-receipt-intelligence-860.test.js
          node --test tests/qa-receipt-intelligence-860.test.js tests/receipt-intelligence-v1.test.js tests/receipt-receiving-preflight-v1.test.js tests/receipt-intelligence-variance-postgres-860.test.js
