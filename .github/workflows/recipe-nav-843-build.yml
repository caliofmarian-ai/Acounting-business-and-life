name: Prepare scoped recipe navigation 843
on:
  push:
    branches: [fix/merchant-recipes-primary-nav-843]
    paths: [.github/recipe-nav-843-build.py, .github/workflows/recipe-nav-843-build.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'caliofmarian-ai/Acounting-business-and-life'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply asserted patch only to inspected blobs
        run: |
          python3 .github/recipe-nav-843-build.py
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('tests/merchant-today-request-context.test.js')
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='f2a42887ddc3fd0257297da003ad199c7f38a2b3'
          s=p.read_text()
          old="successful Storefront domain save invalidates Today without fetching on the Storefront surface"
          assert s.count(old)==1
          s=s.replace(old,"successful Storefront save refreshes recipe navigation without leaving Storefront")
          old="assert.equal(h.state().data,null);assert.equal(h.requests.length,1);"
          assert s.count(old)==1
          s=s.replace(old,"assert.equal(h.state().data,null);assert.equal(h.requests.length,2);\n  assert.equal(h.node('merchantRecipesNav').classList.contains('roleFinanceHidden'),true);\n  assert.equal(h.node('viewDashboard').classList.contains('hidden'),true);")
          old="  h.node('viewDashboard').classList.remove('hidden');\n  const current=h.load();h.requests[1].resolve(domainPayload('non_food'));await current;"
          assert s.count(old)==1
          s=s.replace(old,"  const current=h.load();assert.equal(h.requests.length,2,'reuse the current capability refresh');\n  h.requests[1].resolve(domainPayload('non_food'));await current;\n  assert.equal(h.node('viewDashboard').classList.contains('hidden'),true,'refresh must not navigate');")
          p.write_text(s)
          PY
      - name: Install existing test dependencies
        run: npm ci --ignore-scripts
      - name: Behavioral regression validation
        run: |
          node --check public/v03.js
          node --check public/business-accounting-ui.js
          node --test tests/merchant-recipes-primary-nav-843.test.js tests/merchant-food-tools-presentation.test.js tests/merchant-today-request-context.test.js tests/merchant-today-v2b.test.js
          git diff --check
      - name: Native responsive navigation validation
        env:
          RECIPE_BROWSER_MODULE: ${{ runner.temp }}/recipe-nav/node_modules/playwright/index.mjs
          RECIPE_BROWSER_CHANNEL: chrome
          RECIPE_BROWSER_EVIDENCE: ${{ runner.temp }}/recipe-nav-evidence
        run: |
          npm install --prefix "$RUNNER_TEMP/recipe-nav" --no-package-lock --ignore-scripts playwright@1.58.2
          node scripts/merchant-recipes-navigation-browser.mjs
      - name: Create unreferenced candidate; never update a branch or deploy
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const expected='fix/merchant-recipes-primary-nav-843';
            if(context.ref!=='refs/heads/'+expected)throw new Error('Unexpected branch');
            const ref=await github.rest.git.getRef({...context.repo,ref:'heads/'+expected});
            if(ref.data.object.sha!==context.sha)throw new Error('Branch advanced; stop');
            const paths=['public/index.html','public/business-accounting-ui.js','public/v03.css','public/v03.js','tests/merchant-recipes-primary-nav-843.test.js','tests/merchant-today-request-context.test.js'];
            const trees=[];
            for(const path of paths){
              const blob=await github.rest.git.createBlob({...context.repo,content:fs.readFileSync(path,'utf8'),encoding:'utf-8'});
              trees.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            for(const path of ['.github/recipe-nav-843-build.py','.github/workflows/recipe-nav-843-build.yml'])trees.push({path,mode:'100644',type:'blob',sha:null});
            const parent=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha});
            const tree=await github.rest.git.createTree({...context.repo,base_tree:parent.data.tree.sha,tree:trees});
            const commit=await github.rest.git.createCommit({...context.repo,message:'fix(merchant): put Products & recipes beside Stock\n\nRefs #843\n\nKeep one canonical first-level recipe entry, full mobile labels and current-business capability gating.',tree:tree.data.sha,parents:[context.sha]});
            const receipt={parent:context.sha,commit:commit.data.sha,tree:tree.data.sha,files:paths};
            console.log('CANDIDATE_843 '+JSON.stringify(receipt));
            fs.writeFileSync('recipe-nav-843-candidate.json',JSON.stringify(receipt,null,2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-nav-843-candidate
          path: |
            recipe-nav-843-candidate.json
            ${{ runner.temp }}/recipe-nav-evidence
          retention-days: 7
          if-no-files-found: warn
