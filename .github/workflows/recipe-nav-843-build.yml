name: Prepare scoped recipe navigation 843
on:
  push:
    branches: [fix/merchant-recipes-primary-nav-843]
    paths: [.github/recipe-nav-843-build.py, .github/workflows/recipe-nav-843-build.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'caliofmarian-ai/Acounting-business-and-life'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply asserted patch only to inspected blobs
        run: python3 .github/recipe-nav-843-build.py
      - name: Install existing test dependencies
        run: npm ci --ignore-scripts
      - name: Behavioral regression validation
        run: |
          node --check public/v03.js
          node --check public/business-accounting-ui.js
          node --test tests/merchant-recipes-primary-nav-843.test.js tests/merchant-food-tools-presentation.test.js tests/merchant-today-request-context.test.js tests/merchant-today-v2b.test.js
          git diff --check
      - name: Create unreferenced reviewed candidate; never update a branch or deploy
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const expected='fix/merchant-recipes-primary-nav-843';
            if(context.ref!=='refs/heads/'+expected)throw new Error('Unexpected branch');
            const ref=await github.rest.git.getRef({...context.repo,ref:'heads/'+expected});
            if(ref.data.object.sha!==context.sha)throw new Error('Branch advanced; stop');
            const paths=['public/index.html','public/business-accounting-ui.js','public/v03.css','public/v03.js','tests/merchant-recipes-primary-nav-843.test.js'];
            const trees=[];
            for(const path of paths){
              const content=fs.readFileSync(path,'utf8');
              const blob=await github.rest.git.createBlob({...context.repo,content,encoding:'utf-8'});
              trees.push({path,mode:'100644',type:'blob',sha:blob.data.sha});
            }
            for(const path of ['.github/recipe-nav-843-build.py','.github/workflows/recipe-nav-843-build.yml'])trees.push({path,mode:'100644',type:'blob',sha:null});
            const parent=await github.rest.git.getCommit({...context.repo,commit_sha:context.sha});
            const tree=await github.rest.git.createTree({...context.repo,base_tree:parent.data.tree.sha,tree:trees});
            const commit=await github.rest.git.createCommit({...context.repo,message:'fix(merchant): put Products & recipes beside Stock\n\nRefs #843\n\nKeep one canonical first-level recipe entry, full mobile labels and current-business capability gating.',tree:tree.data.sha,parents:[context.sha]});
            const receipt={parent:context.sha,commit:commit.data.sha,tree:tree.data.sha,files:paths};
            console.log('CANDIDATE_843 '+JSON.stringify(receipt));
            fs.writeFileSync('recipe-nav-843-candidate.json',JSON.stringify(receipt,null,2));
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-nav-843-candidate
          path: recipe-nav-843-candidate.json
          retention-days: 7
          if-no-files-found: error
