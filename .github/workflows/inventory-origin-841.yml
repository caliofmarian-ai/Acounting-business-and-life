name: Inventory Origin 841 Exact Head

on:
  pull_request:
    paths:
      - inventory-origin-core.js
      - server-business-accounting.js
      - public/v03.js
      - public/inventory-*-ui.js
      - public/inventory-write-context.js
      - qa-inventory-origin-841.js
      - qa-acceptance.js
      - tests/inventory-origin-authority-841.test.js
      - tests/merchant-inventory-read-context.test.js
      - scripts/inventory-origin-runtime-841.mjs
      - scripts/inventory-write-browser-841.mjs
      - .github/workflows/inventory-origin-841.yml

permissions:
  contents: read

jobs:
  isolated-postgres-http:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abl_admin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abl_admin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: abl_admin_ci
      TOKEN_SECRET: ci-inventory841-not-for-production
      APP_PIN: '0000'
      NODE_ENV: test
      PORT: '3000'
      PAYMONGO_MODE: sandbox
      PAYMONGO_LIVE_ENABLED: 'false'
      RAILWAY_SERVICE_NAME: accounting-admin-runtime-ci
      ABL_INVENTORY_ORIGIN_CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert literal checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Literal-head origin and deferred UI regressions
        run: node --test tests/inventory-origin-authority-841.test.js tests/merchant-inventory-read-context.test.js
      - name: Start application with isolated PostgreSQL
        run: |
          npm start > /tmp/abl-inventory-origin-841.log 2>&1 &
          echo $! > /tmp/abl-inventory-origin-841.pid
      - name: Wait for health
        run: |
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/abl-inventory-origin-841.log
          exit 1
      - name: Verify real PostgreSQL concurrency and authenticated Merchant HTTP
        run: node scripts/inventory-origin-runtime-841.mjs
      - name: Application log on failure
        if: failure()
        run: tail -100 /tmp/abl-inventory-origin-841.log || true
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/abl-inventory-origin-841.pid ]; then
            kill "$(cat /tmp/abl-inventory-origin-841.pid)" 2>/dev/null || true
          fi
