name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pin npm
        run: npm install --global npm@10.8.2
      - name: Dependency evidence
        run: |
          node --version
          npm --version
          sha256sum package-lock.json
      - run: npm ci
      - run: npm test
