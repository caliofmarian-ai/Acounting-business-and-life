name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pin npm
        run: npm install --global npm@10.8.2
      - name: Generate candidate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Capture dependency evidence
        run: |
          node --version
          npm --version
          sha256sum package-lock.json
      - name: Commit canonical lockfile to reproducibility branch
        if: github.event_name == 'pull_request' && github.head_ref == 'build/reproducibility-p2-615'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          cp package-lock.json /tmp/package-lock.json
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          cp /tmp/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Canonical lockfile already committed."
          else
            git commit -m "BUILD REPRODUCIBILITY P2 — commit canonical npm lockfile"
            git push origin "$HEAD_BRANCH"
          fi
      - run: npm ci
      - run: npm test
