name: Account Access Retention
on:
  pull_request:
    paths:
      - 'account-access-retention.js'
      - 'account-access-core.js'
      - 'privacy/account-access-retention.json'
      - 'tests/account-access-retention.test.js'
      - 'scripts/account-access-retention*.mjs'
      - '.github/workflows/account-access-retention.yml'
permissions:
  contents: read
concurrency:
  group: account-access-retention-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: fixture-only-815
          POSTGRES_DB: account_access_retention_815
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d account_access_retention_815"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:fixture-only-815@127.0.0.1:5432/account_access_retention_815
      ACCOUNT_ACCESS_RETENTION_FIXTURE_DB: '1'
      TESTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/account-access-retention.test.js
      - run: node scripts/account-access-retention-acceptance.mjs
      - run: node scripts/account-access-retention-expiry-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-access-retention-${{ github.event.pull_request.head.sha }}
          path: artifacts/account-access-retention*.json
          retention-days: 7
          if-no-files-found: warn
