name: Merchant Stock CSV Exact Head 865

on:
  pull_request:
    paths:
      - 'public/merchant-stock-csv-intake.js'
      - 'scripts/merchant-stock-csv-browser-acceptance-865.mjs'
      - 'server-business-accounting.js'
      - 'qa-purchase-intent-881.js'
      - 'tests/merchant-stock-csv-intake-v1.test.js'
      - '.github/workflows/merchant-stock-csv-exact-head-865.yml'

permissions:
  contents: read

jobs:
  exact-head:
    name: Validate literal PR source head
    if: ${{ github.event.pull_request.number == 865 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable PR head (not synthetic merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert exact reviewed head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Tested immutable PR head: $EXPECTED_SHA"
      - name: Syntax and fail-closed CSV intake regression
        run: |
          node --check public/merchant-stock-csv-intake.js
          node --check tests/merchant-stock-csv-intake-v1.test.js
          node --check qa-purchase-intent-881.js
          node --test tests/merchant-stock-csv-intake-v1.test.js
      - name: Native Chrome Merchant CSV 390px flow (synthetic data, no server writes)
        shell: bash
        run: |
          node --check scripts/merchant-stock-csv-browser-acceptance-865.mjs
          npm install --prefix "$RUNNER_TEMP/merchant-csv-browser" --no-package-lock --ignore-scripts playwright@1.58.2
          google-chrome --version
          MERCHANT_CSV_BROWSER_MODULE="$RUNNER_TEMP/merchant-csv-browser/node_modules/playwright/index.mjs" MERCHANT_CSV_BROWSER_CHANNEL=chrome node scripts/merchant-stock-csv-browser-acceptance-865.mjs
