name: Admin Runtime Contract

on:
  pull_request:
    paths:
      - 'admin-authorization.js'
      - 'admin-functions.js'
      - 'server-admin-operations.js'
      - 'public/admin-console.html'
      - 'public/admin-console.css'
      - 'public/admin-console.js'
      - 'public/admin-operations-ui.js'
      - 'public/mobile-feature-loader.js'
      - 'server-paymongo.js'
      - 'monetization-core.js'
      - 'finance-core.js'
      - 'server-payments.js'
      - 'server-orders.js'
      - 'server-services.js'
      - 'server-suppliers.js'
      - 'server-delivery.js'
      - 'public/shell.js'
      - 'public/app.js'
      - 'public/v03.js'
      - 'public/help-linking.js'
      - 'public/profile-governance-ui.js'
      - 'public/services-ui.js'
      - 'public/delivery-ui.js'
      - 'public/suppliers-ui.js'
      - 'public/marketplace-ui.js'
      - 'public/orders-ui.js'
      - '.github/workflows/admin-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'admin-authorization.js'
      - 'admin-functions.js'
      - 'server-admin-operations.js'
      - 'public/admin-console.html'
      - 'public/admin-console.css'
      - 'public/admin-console.js'
      - 'public/admin-operations-ui.js'
      - 'public/mobile-feature-loader.js'
      - 'server-paymongo.js'
      - 'server-delivery.js'
      - 'server-suppliers.js'
      - 'server-services.js'
      - 'server-orders.js'
      - 'server-payments.js'
      - 'finance-core.js'
      - 'monetization-core.js'
      - 'public/shell.js'
      - 'public/app.js'
      - 'public/v03.js'
      - 'public/help-linking.js'
      - 'public/profile-governance-ui.js'
      - 'public/services-ui.js'
      - 'public/delivery-ui.js'
      - 'public/suppliers-ui.js'
      - 'public/marketplace-ui.js'
      - 'public/orders-ui.js'
      - '.github/workflows/admin-runtime.yml'

permissions:
  contents: read

jobs:
  postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: abl_admin_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d abl_admin_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: abl_admin_ci
      TOKEN_SECRET: ci-admin-runtime-secret-not-for-production
      APP_PIN: '0000'
      NODE_ENV: test
      PORT: '3000'
      PAYMONGO_MODE: sandbox
      PAYMONGO_LIVE_ENABLED: 'false'
      RAILWAY_SERVICE_NAME: accounting-admin-runtime-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Start full application chain on isolated Postgres
        run: |
          npm start > /tmp/abl-admin-runtime.log 2>&1 &
          echo $! > /tmp/abl-admin-runtime.pid
      - name: Wait for health
        run: |
          for i in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:3000/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/abl-admin-runtime.log
          exit 1
      - name: Verify dedicated Admin workspace
        run: |
          curl --fail --silent http://127.0.0.1:3000/admin | grep -q 'Admin Workspace'
          status=$(curl --silent --output /tmp/admin-me.json --write-out '%{http_code}' http://127.0.0.1:3000/api/admin/me)
          test "$status" = "401"
          bootstrap_status=$(curl --silent --output /tmp/admin-bootstrap.json --write-out '%{http_code}' http://127.0.0.1:3000/api/admin/bootstrap)
          test "$bootstrap_status" = "401"
      - name: Verify profile-switch JSON survives the public proxy
        run: |
          status=$(curl --max-time 12 --silent --output /tmp/profile-switch.json --write-out '%{http_code}' \
            -X PATCH -H 'Content-Type: application/json' -H 'Authorization: Bearer invalid-session' \
            --data '{"role":"customer"}' http://127.0.0.1:3000/api/me/active-role)
          test "$status" = "401"
      - name: Stop application
        if: always()
        run: |
          if [ -f /tmp/abl-admin-runtime.pid ]; then
            kill "$(cat /tmp/abl-admin-runtime.pid)" 2>/dev/null || true
          fi
