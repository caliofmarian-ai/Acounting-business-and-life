<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-labelledby="title desc">
<title id="title">Business & Life profile architecture</title>
<desc id="desc">One account identity connects to five separate user profiles: Customer, Merchant, Supplier, Delivery, and Local Services. Shared layers include commerce and money, business operations, trust and safety, and public guidance.</desc>
