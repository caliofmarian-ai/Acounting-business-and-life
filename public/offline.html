<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a7c66">
  <title>Business & Life — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f5f8f7;color:#17233c;font-family:Inter,system-ui,-apple-system,sans-serif;padding:20px}
    main{width:min(100%,420px);background:#fff;border:1px solid #dfe8e4;border-radius:24px;padding:24px;box-shadow:0 14px 40px rgba(23,35,60,.08)}
    .mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#0a7c66,#17233c);display:grid;place-items:center;color:#fff;font-weight:900;margin-bottom:18px}
    h1{font-size:24px;margin:0 0 8px}p{margin:0 0 16px;color:#687386;line-height:1.55}
    button{width:100%;border:0;border-radius:14px;padding:13px;background:#0a7c66;color:#fff;font:inherit;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="mark">B&L</div>
    <h1>You’re offline</h1>
    <p>Business & Life needs a connection before it loads the current app version. This prevents an old cached screen from behaving like the live application.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
